<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calculadora de IMC</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
</head>
<body>
  <main id="container">
    <section id="img" aria-label="Ilustração treino">
      <img src="assets/images/Ilustration_workout.svg" alt="Ilustração de treino" />
    </section>

    <section id="calculator" aria-labelledby="title">
      <form id="form" novalidate>
        <h1 id="title">Calculadora - IMC</h1>

        <div class="input-box">
          <label for="weight">Peso em Kg</label>
          <div class="input-field">
            <i class="fa-solid fa-weight-scale" aria-hidden="true"></i>
            <input 
              type="number" 
              id="weight" 
              name="weight"
              placeholder="Ex: 65.5" 
              step="0.1" 
              min="1" 
              required 
              aria-describedby="weightHelp"
              aria-label="Peso em quilogramas"
            />
            <span>Kg</span>
          </div>
          <small id="weightHelp" class="sr-only">Informe seu peso em quilogramas com uma casa decimal.</small>
        </div>

        <div class="input-box">
          <label for="height">Altura em metros</label>
          <div class="input-field">
            <i class="fa-solid fa-ruler" aria-hidden="true"></i>
            <input 
              type="number" 
              id="height" 
              name="height"
              placeholder="Ex: 1.70" 
              step="0.01" 
              min="0.1" 
              required 
              aria-describedby="heightHelp"
              aria-label="Altura em metros"
            />
            <span>m</span>
          </div>
          <small id="heightHelp" class="sr-only">Informe sua altura em metros com duas casas decimais, usando ponto.</small>
        </div>

        <button id="calculate" type="submit" aria-label="Calcular IMC">Calcular</button>
      </form>

      <div id="bmi-bar" role="region" aria-label="Faixas de IMC">
        <div class="bar-segment underweight" tabindex="0" aria-label="IMC abaixo do ideal">Abaixo</div>
        <div class="bar-segment normal" tabindex="0" aria-label="IMC ideal">Ideal</div>
        <div class="bar-segment overweight" tabindex="0" aria-label="IMC com sobrepeso">Sobrepeso</div>
        <div class="bar-segment obesity" tabindex="0" aria-label="IMC com obesidade">Obesidade</div>
        <div id="bmi-indicator" aria-live="polite" aria-atomic="true"></div>
      </div>

      <section id="infos" class="hidden" aria-live="polite" aria-atomic="true">
        <article id="result">
          <div id="bmi" role="img" aria-label="Resultado do IMC">
            <span id="value" aria-live="polite"></span>
            <span>Seu IMC</span>
          </div>
          <p id="description"></p>
        </article>
        <div id="more_info" class="hidden">
          <a href="https://mundoeducacao.uol.com.br/saude-bem-estar/imc.htm" target="_blank" rel="noopener noreferrer">
            Mais informações sobre o IMC <i class="fa-solid fa-link" aria-hidden="true"></i>
          </a>
        </div>
      </section>
    </section>
  </main>

  <script src="assets/js/script.js"></script>
</body>
</html>
